eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}

rabbitmq:
  exchange: resources.direct
  queue: resources.queue
  routing-key: resources.uploaded

retry:
  max-attempts: 3
  initial-interval: 1000
  multiplier: 2.0
  max-delay: 10000

logging:
  level:
    com.example: INFO
    com.example.resourceservice.client.StorageServiceClient: WARN
